name: Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'app/src/androidTest/**'
      - 'test-fixtures/demo-embedded.mkv'
      - 'test-fixtures/dialogue-coverage.en.srt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            test "$(adb shell cmd connectivity airplane-mode | tr -d '\r')" = enabled
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest > "$RUNNER_TEMP/android-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/android-smoke.log"; exit 1; }
            cat "$RUNNER_TEMP/android-smoke.log"
            adb logcat -d -s DialogueCoverage:I '*:S'

      - name: Report emulator test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          def annotate(message):
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{escaped}")

          failures = []
          for report in Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              for test in ElementTree.parse(report).iter("testcase"):
                  failure = test.find("failure")
                  if failure is not None:
                      message = failure.get("message") or (failure.text or "").split("\n", 1)[0]
                      failures.append(f"{test.get('name')}: {message}")

          if failures:
              for failure in failures[:5]:
                  annotate(failure)
          else:
              log = Path(os.environ["RUNNER_TEMP"]) / "android-smoke.log"
              if log.is_file():
                  lines = log.read_text(errors="replace").splitlines()
                  annotate("\n".join(lines[-28:]))
          PY
