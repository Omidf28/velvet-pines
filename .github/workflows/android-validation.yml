name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_debug_apk:
        description: Export the validated debug APK for local signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare the offline dictionary with the previous version
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'Dictionary comparison skipped on initial branch creation.'
            exit 0
          fi
          asset=app/src/main/assets/lexicon/dictionary-en-fa.sqlite.bin
          git cat-file -e "$BASE_SHA^{commit}"
          if git diff --quiet "$BASE_SHA" HEAD -- "$asset"; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:$asset"; then
            echo 'Dictionary comparison skipped because the baseline has no dictionary asset.'
            exit 0
          fi
          previous=$(mktemp)
          trap 'rm -f "$previous"' EXIT
          git show "$BASE_SHA:$asset" > "$previous"
          python3 scripts/verify-lexicon.py --previous "$previous" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Use JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Build, test, and lint Android
        run: |
          ./gradlew --no-daemon --no-configuration-cache --console=plain \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Check the Room schema and SQLite migrations
        run: |
          python3 scripts/verify-review-migration.py \
            --room-schema app/build/generated/ksp/debug/kotlin/com/subtitleplayer/prototype/SavedWordsDatabase_Impl.kt

      - name: Verify the debug signature and packaged dictionaries
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-lexicon.py --apk app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-lexicon.py --apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Export debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.export_debug_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 3
